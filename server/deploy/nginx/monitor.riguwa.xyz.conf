# Inkstake Arena run monitor - monitor.riguwa.xyz
#
# Install as /etc/nginx/sites-available/inkstake-monitor and symlink into sites-enabled, then
# run certbot, which appends the TLS server block and the port-80 redirect:
#
#   sudo certbot --nginx -d monitor.riguwa.xyz
#
# This is the pre-certbot file on purpose: the TLS block certbot writes is machine-specific
# (certificate paths, its own options-ssl-nginx.conf include) and it regenerates on renewal.
#
# The VPS hosts unrelated projects. Everything below is scoped to this server_name and this
# upstream; nothing is declared at http level - no `map`, no shared upstream - so enabling or
# removing this file cannot change how any other site behaves.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.riguwa.xyz;

    # The monitor speaks WebSocket and nothing else. A plain GET gets 426 from it, which is
    # the honest answer.
    location / {
        proxy_pass http://127.0.0.1:8920;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A staked run is a whole game session. Do not cut the socket mid-run.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
