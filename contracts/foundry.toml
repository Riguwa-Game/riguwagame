[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"   # verified against the live chain - see CLAUDE.md
verbosity = 2
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false

[rpc_endpoints]
creditcoin_testnet = "https://rpc.cc3-testnet.creditcoin.network"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
creditcoin_testnet = { key = "blockscout", url = "https://creditcoin-testnet.blockscout.com/api", chain = 102031 }
